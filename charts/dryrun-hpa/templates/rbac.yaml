{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dryrun-hpa.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dryrun-hpa.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dryrun-hpa.fullname" . }}
  labels:
    {{- include "dryrun-hpa.labels" . | nindent 4 }}
{{- /* files/controller-role.yaml is copied from config/rbac/role.yaml by make generate. */}}
rules:
  {{- (.Files.Get "files/controller-role.yaml" | fromYaml).rules | toYaml | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dryrun-hpa.fullname" . }}
  labels:
    {{- include "dryrun-hpa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dryrun-hpa.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dryrun-hpa.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.aggregateToDefaultRoles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dryrun-hpa.fullname" . }}-edit
  labels:
    {{- include "dryrun-hpa.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
rules:
  - apiGroups: ["dryrun-hpa.io"]
    resources: ["dryrunhorizontalpodautoscalers"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["dryrun-hpa.io"]
    resources: ["dryrunhorizontalpodautoscalers/status", "virtualworkloads", "virtualworkloads/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dryrun-hpa.fullname" . }}-view
  labels:
    {{- include "dryrun-hpa.labels" . | nindent 4 }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["dryrun-hpa.io"]
    resources: ["dryrunhorizontalpodautoscalers", "dryrunhorizontalpodautoscalers/status", "virtualworkloads", "virtualworkloads/status"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- end }}
