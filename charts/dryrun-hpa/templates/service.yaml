apiVersion: v1
kind: Service
metadata:
  name: {{ include "dryrun-hpa.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dryrun-hpa.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dryrun-hpa.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    - name: export
      port: 8082
      targetPort: export
