---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dryrun-hpa-controller
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - custom.metrics.k8s.io
  - external.metrics.k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
- apiGroups:
  - dryrun-hpa.io
  resources:
  - dryrunhorizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dryrun-hpa.io
  resources:
  - dryrunhorizontalpodautoscalers/finalizers
  verbs:
  - update
- apiGroups:
  - dryrun-hpa.io
  resources:
  - dryrunhorizontalpodautoscalers/status
  - virtualworkloads/scale
  - virtualworkloads/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - dryrun-hpa.io
  resources:
  - virtualworkloads
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  verbs:
  - get
  - list
