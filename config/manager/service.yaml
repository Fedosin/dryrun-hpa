apiVersion: v1
kind: Service
metadata:
  name: dryrun-hpa-controller
  namespace: dryrun-hpa-system
  labels:
    app.kubernetes.io/name: dryrun-hpa-controller
spec:
  selector:
    app.kubernetes.io/name: dryrun-hpa-controller
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
    - name: export
      port: 8082
      targetPort: export
