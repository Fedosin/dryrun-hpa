# Try a more aggressive configuration for the "web" Deployment without
# touching it. The spec is the same as autoscaling/v2 HorizontalPodAutoscaler.
apiVersion: dryrun-hpa.io/v1alpha1
kind: DryrunHorizontalPodAutoscaler
metadata:
  name: web-aggressive
  annotations:
    # Optional simulation settings.
    dryrun-hpa.io/pod-readiness-delay: 20s
    dryrun-hpa.io/metrics-delay: 40s
    # What-if: evaluate the HPA as if the app container requested 1 CPU.
    dryrun-hpa.io/request-overrides: '{"app":{"cpu":"1"}}'
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 30
