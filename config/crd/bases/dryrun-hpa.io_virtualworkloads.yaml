---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: virtualworkloads.dryrun-hpa.io
spec:
  group: dryrun-hpa.io
  names:
    categories:
    - dryrun
    kind: VirtualWorkload
    listKind: VirtualWorkloadList
    plural: virtualworkloads
    shortNames:
    - vwl
    singular: virtualworkload
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.sourceRef.name
      name: Source
      type: string
    - jsonPath: .spec.replicas
      name: Virtual
      type: integer
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .status.sourceReplicas
      name: Real
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VirtualWorkload mirrors a real workload. The dry-run HPA loop scales it
          through its scale subresource, and its virtual pods receive the real
          workload's load. It is managed by the controller; do not create it by hand.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VirtualWorkloadSpec describes the simulated workload.
            properties:
              containers:
                description: |-
                  Containers are the containers of every virtual pod, with the requests
                  used to compute utilization.
                items:
                  description: VirtualContainer is a container of a virtual pod.
                  properties:
                    name:
                      type: string
                    requests:
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: Requests are the resource requests of the container.
                      type: object
                    restartableInit:
                      description: |-
                        RestartableInit marks a sidecar (restartable init container). The HPA
                        includes its requests in pod-level utilization.
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              lifecycleProfile:
                default: Parallel
                description: LifecycleProfile selects how virtual pods start and stop.
                enum:
                - Parallel
                - OrderedReady
                type: string
              replicas:
                description: Replicas is the virtual replica count, written by the
                  dry-run HPA loop.
                format: int32
                minimum: 0
                type: integer
              simulation:
                description: Simulation tunes the virtual pod lifecycle.
                properties:
                  metricsDelay:
                    description: MetricsDelay is how long a new virtual pod reports
                      no metrics.
                    type: string
                  podReadinessDelay:
                    description: PodReadinessDelay is how long a new virtual pod stays
                      unready.
                    type: string
                type: object
              sourceRef:
                description: SourceRef is the real workload this object mirrors.
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            required:
            - replicas
            - sourceRef
            type: object
          status:
            description: VirtualWorkloadStatus is the observed state of the simulated
              workload.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: LastSyncTime is when the status was last written.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status was computed
                  for.
                format: int64
                type: integer
              readyReplicas:
                description: ReadyReplicas is the number of ready virtual pods.
                format: int32
                type: integer
              replicas:
                description: Replicas is the number of virtual pods.
                format: int32
                type: integer
              selector:
                description: Selector selects the virtual pods. It is used by the
                  scale subresource.
                type: string
              sourceReplicas:
                description: SourceReplicas is the replica count of the real workload.
                format: int32
                type: integer
              sourceSelector:
                description: SourceSelector selects the pods of the real workload.
                type: string
              sourceUsage:
                description: SourceUsage is the total usage of the real workload,
                  per container.
                items:
                  description: ContainerUsage is the summed usage of one container
                    across the real pods.
                  properties:
                    name:
                      type: string
                    pods:
                      description: Pods is the number of real pods that contributed
                        to the sum.
                      format: int32
                      type: integer
                    usage:
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      description: Usage is the summed usage.
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
